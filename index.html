<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>설산 과학 리조트 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 상단 HUD 띠 + 아래 전면 3D 무대(설산 리조트 + 건물 실내), 미니맵·조이스틱이 무대 위에 떠 있음. 겨울 밤하늘 남색 단일 룩 */
:root{
  --ink:#13233a; --slate:#1c3150; --line:#33507a;
  --paper:#f6f3ea; --paper-ink:#1b2738; --paper-mute:#5f6b7c;
  --amber:#f2b33d; --ok:#3fae68; --bad:#d9573f; --fg:#eaf1fb; --mute:#9fb3cf;
  --f-display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--ink);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-size:1.45rem;margin-right:6px;white-space:nowrap}
.brand b{color:var(--amber);font-weight:400}
.chip{display:flex;align-items:center;gap:6px;background:var(--slate);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.82rem;white-space:nowrap}
.chip .k{color:var(--mute);font-size:.72rem;letter-spacing:.04em}
.chip .v{font-weight:700;font-variant-numeric:tabular-nums}
.pw{display:flex;gap:3px}
.pw span{width:20px;height:24px;display:grid;place-items:center;border-radius:4px;background:#0c182a;border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute)}
.pw span.on{color:#1c1a12;background:var(--amber);border-color:var(--amber)}
.hud .sp{flex:1}
.tbtn{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem}
.tbtn:hover{border-color:var(--amber)}
.mission{font-size:.85rem;color:var(--mute);display:flex;gap:8px;align-items:baseline}
.mission b{color:var(--amber);font-weight:500;font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;border-radius:12px;overflow:hidden;background:#cfdcea;border:1px solid var(--line)}
canvas#cv{display:block;width:100%;height:100%;touch-action:none}
#mini{position:absolute;right:10px;top:10px;width:132px;height:124px;border-radius:10px;background:rgba(19,35,58,.8);border:1px solid rgba(255,255,255,.25)}
.prompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);border:none;border-radius:999px;padding:9px 18px;font-size:.9rem;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.3);white-space:nowrap;max-width:calc(100% - 170px);overflow:hidden;text-overflow:ellipsis}
.prompt kbd{font-family:inherit;background:var(--paper-ink);color:var(--paper);border-radius:4px;padding:1px 6px;margin-right:6px;font-size:.78rem}
.joy{position:absolute;left:14px;bottom:14px;width:120px;height:120px;border-radius:50%;background:rgba(19,35,58,.28);border:2px solid rgba(255,255,255,.5);display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(246,243,234,.85);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.act{position:absolute;right:14px;bottom:14px;width:80px;height:80px;border-radius:50%;display:none;font-family:var(--f-display);font-size:1.2rem;background:var(--amber);color:#1c1a12;border:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
@media (any-pointer:coarse){.joy{display:block}.act{display:block}.prompt{bottom:auto;top:12px;left:calc(50% - 66px)}}
.flash{position:absolute;inset:0;background:rgba(255,255,255,0);pointer-events:none;transition:background .9s}
.flash.on{background:rgba(255,255,255,.95);transition:none}
.fade{position:absolute;inset:0;background:rgba(10,16,26,0);pointer-events:none;transition:background .55s}
.fade.on{background:rgba(10,16,26,1);transition:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--paper-ink);font-family:var(--f-display);font-size:1.3rem}

.overlay{position:fixed;inset:0;background:rgba(10,20,36,.66);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);color:var(--paper-ink);border-radius:14px;width:100%;max-width:600px;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card.wide{max-width:760px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0;text-wrap:balance;line-height:1.2}
.card p{line-height:1.65;margin:0}
.head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:#fff;border-radius:5px;padding:3px 8px}
.qn{font-size:.78rem;color:var(--paper-mute);font-variant-numeric:tabular-nums}
.x{margin-left:auto;background:none;border:none;font-size:1.5rem;line-height:1;color:var(--paper-mute);padding:2px 6px}
.qtext{font-size:1.05rem;font-weight:500;line-height:1.65;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fffdf8;border:2px solid #dcd6c6;border-radius:10px;padding:10px 12px;font-size:.95rem;color:var(--paper-ink);line-height:1.5}
.opt .n{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #b8b09c;display:grid;place-items:center;font-size:.78rem;font-weight:700}
.opt.sel{border-color:var(--zc,#333);background:#fff}
.opt.sel .n{background:var(--zc,#333);border-color:var(--zc,#333);color:#fff}
.opt:disabled{cursor:default;opacity:.85}
.sa{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:2px solid #dcd6c6;background:#fffdf8;color:var(--paper-ink)}
.sa:focus{border-color:var(--zc,#333);outline:none}
.hint{font-size:.8rem;color:var(--paper-mute);margin-top:6px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:11px 20px;font-size:.95rem;font-weight:700;background:var(--paper-ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--paper-ink);border:2px solid #cfc8b4}
.btn.amber{background:var(--amber);color:#1c1a12}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.sm{padding:8px 14px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.result{border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.result.ok{background:#e2f2e6;border:1px solid #b5dcc0}
.result.bad{background:#f8e3dd;border:1px solid #ecbcae}
.result.gold{background:#fdf3dc;border:1px solid #f0d28f}
.result strong{font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.result.ok strong{color:#23784a}.result.bad strong{color:#a8392a}.result.gold strong{color:#8a5a10}
.exp{font-size:.92rem;line-height:1.7;color:#344052}
.digit{display:inline-grid;place-items:center;width:34px;height:40px;background:var(--amber);border-radius:6px;font-family:var(--f-display);font-size:1.5rem;color:#1c1a12;margin:0 4px;vertical-align:middle}
.lede{color:var(--paper-mute);margin:6px 0 16px!important}
.how{display:grid;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.how li{display:flex;gap:10px;align-items:baseline;font-size:.92rem;line-height:1.55}
.how li span{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--paper-ink);border-radius:4px;padding:2px 6px}
label.lb{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--paper-mute)}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.zones div{border-radius:8px;padding:8px;color:#fff;font-size:.74rem;line-height:1.35}
.zones div b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05rem}
@media (max-width:480px){.zones{grid-template-columns:repeat(2,1fr)}}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--paper-mute);font-weight:700}
.lock{display:flex;justify-content:center;margin:12px 0 6px}
.lock input{width:100%;max-width:220px;text-align:center;font-family:var(--f-display);font-size:2.2rem;letter-spacing:.5em;padding:8px 0 8px .5em;border-radius:10px;border:2px solid #cfc8b4;background:#fffdf8;color:var(--paper-ink)}
.clue{text-align:center;font-size:.9rem;color:var(--paper-mute)}
.clue b{font-variant-numeric:tabular-nums;letter-spacing:.3em;color:var(--paper-ink)}
.msg{text-align:center;font-size:.88rem;color:var(--bad);min-height:1.4em;margin-top:6px}
.fq{border:1px solid #ddd6c4;border-radius:12px;padding:14px;background:#fffdf8;margin-bottom:10px}
.fq.good{border-color:#9fd1ad;background:#eef8f0}
.fq.wrongq{border-color:#e6a99a;background:#fbefeb}
.fq .st{font-size:.82rem;font-weight:700;margin-top:8px;min-height:1.2em}
.fq.good .st{color:#23784a}.fq.wrongq .st{color:#a8392a}

/* 실험 */
.ecv{display:block;width:100%;max-width:100%;aspect-ratio:2/1;border-radius:10px;border:1px solid #d8d2c2;background:#eef3f8}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}
.ctrl label{font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.ctrl label b{font-variant-numeric:tabular-nums;min-width:3.2em;display:inline-block}
.ctrl input[type=range]{flex:1;accent-color:var(--zc,#1b2738);min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid #cfc8b4;background:#fffdf8;color:var(--paper-ink);border-radius:8px;padding:7px 10px;font-size:.84rem;font-weight:500}
.seg button.on{background:var(--zc,#1b2738);border-color:var(--zc,#1b2738);color:#fff}
.ecols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.ecols{grid-template-columns:1fr}}
.ecols>div{min-width:0}
.box-t{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:var(--paper-mute);margin-bottom:6px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tasks li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;line-height:1.45}
.tasks li i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #b8b09c;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;color:#fff;margin-top:1px}
.tasks li.done i{background:var(--ok);border-color:var(--ok)}
.tasks li.done{color:#23784a}
.dtw{overflow-x:auto}
table.dt{color:var(--paper-ink);width:100%;border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.dt th,.dt td{border:1px solid #ddd6c4;padding:5px 8px;text-align:center}
.dt th{background:#efe9da;font-weight:700;font-size:.78rem}
.dt td.empty{color:var(--paper-mute);font-size:.8rem}
details.enote{border:1px dashed var(--zc,#1b2738);border-radius:10px;padding:8px 12px;margin-bottom:14px;background:#fffdf8}
details.enote summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--zc,#1b2738)}
details.enote .in{display:grid;gap:8px;margin-top:8px}

/* 표창장 */
.award{border:3px double #8a6a2a;border-radius:6px;padding:26px 22px 20px;position:relative;background:linear-gradient(#fffdf6,#fbf5e4)}
.award h3{font-family:var(--f-display);font-weight:400;font-size:2.3rem;letter-spacing:.6em;text-align:center;margin:0 0 14px;padding-left:.6em}
.award .nm{text-align:center;font-size:1.05rem;margin-bottom:14px}
.award .nm b{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.award .body{font-size:.95rem;line-height:1.85;text-align:justify}
.award dl{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 12px;margin:16px 0 12px;font-size:.84rem;border-top:1px solid #e3d8bb;padding-top:12px}
.award dt{color:var(--paper-mute)}
.award dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:480px){.award dl{grid-template-columns:auto 1fr}}
.award .sign{text-align:center;margin-top:14px;line-height:1.8}
.award .sign b{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.seal{display:inline-grid;place-items:center;width:46px;height:46px;border:2.5px solid var(--bad);color:var(--bad);border-radius:6px;font-family:var(--f-display);font-size:.85rem;line-height:1.05;margin-left:8px;vertical-align:middle;transform:rotate(-6deg)}
.qgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;font-variant-numeric:tabular-nums}
.qgrid div{border-radius:5px;text-align:center;padding:4px 0;font-size:.66rem;background:#e2f2e6;color:#23784a;line-height:1.3}
.qgrid div.w{background:#f8e3dd;color:#a8392a}
.qgrid div b{display:block;font-size:.86rem}
@media (max-width:560px){.qgrid{grid-template-columns:repeat(5,1fr)}}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.note{font-size:.82rem;color:var(--paper-mute);margin-top:10px!important;text-align:center}
.rv{display:flex;flex-direction:column;gap:10px}
.rv article{border:1px solid #ddd6c4;border-radius:10px;padding:12px 14px;background:#fffdf8}
.rv .meta{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:.75rem;color:var(--paper-mute);flex-wrap:wrap}
.rv .q{font-weight:500;line-height:1.6;margin-bottom:6px}
.rv .a{font-size:.9rem;margin-bottom:4px}.rv .a b{color:#23784a}
.empty{color:var(--paper-mute);text-align:center;padding:20px 0}
@media (max-width:640px){.brand{font-size:1.2rem}.chip{padding:4px 8px}.mission{font-size:.78rem}#mini{width:104px;height:98px}}
@media (prefers-reduced-motion:reduce){.flash,.fade{transition:none}}
</style>

<div id="app">
  <header class="hud">
    <div class="brand">설산 과학 리조트 <b>탈출</b></div>
    <div class="chip"><span class="k">탐험가</span><span class="v" id="hName">-</span></div>
    <div class="chip"><span class="k">실험</span><span class="v" id="hExp">0 / 4</span></div>
    <div class="chip"><span class="k">해결</span><span class="v" id="hSolved">0 / 15</span></div>
    <div class="chip"><span class="k">비밀번호</span><span class="pw" id="hPw"><span>?</span><span>?</span><span>?</span><span>?</span></span></div>
    <div class="chip"><span class="k">시간</span><span class="v" id="hTime">00:00</span></div>
    <div class="chip"><span class="k">위치</span><span class="v" id="hZone">정문</span></div>
    <div class="sp"></div>
    <button class="tbtn" id="bReview" type="button">푼 문제 보기</button>
    <button class="tbtn" id="bFull" type="button">전체화면</button>
  </header>
  <div class="mission"><b>현재 미션</b><span id="hMission">건물에 들어가 실험을 마친 뒤 문제를 해결하세요.</span></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="loading" id="loading">설원을 준비하는 중…</div>
    <canvas id="mini" width="264" height="248" aria-label="미니맵"></canvas>
    <div class="flash" id="flash"></div>
    <div class="fade" id="fade"></div>
    <button class="prompt" id="prompt" type="button" hidden></button>
    <div class="joy" id="joy"><i id="knob"></i></div>
    <button class="act" id="act" type="button">조사</button>
  </div>
</div>
<div class="overlay" id="ov" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
/* =========================================================
   설정 · 문제 데이터 (문항 교체 시 이 부분만 수정)
   zone: A~D = 건물 구역(각 3문제, 구역 완료 시 비밀번호 1자리), F = 정문 마지막 평가
   ========================================================= */
const ISSUER='동원중학교 과학과';
// 구글 시트 기록용 Apps Script 웹 앱 주소 (배포 후 https://script.google.com/macros/s/…/exec 를 붙여 넣으세요. 비워 두면 제출 버튼이 숨겨짐)
const SHEET_URL='https://script.google.com/macros/s/AKfycbzJYc3z902X61WuMbC4ZhK2Xf-oWBny37J001vsKoIlrV3BOb2m-hYUoA0o5pM_tYh1Nw/exec';
const SECRET='DW-GAS-2026-snow'; // 비밀번호·확인 코드 생성용 키 (바꾸면 기존 코드 검증 불가)
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
const pwFor=(name,at)=>String(cyrb53(SECRET+'|pw|'+name+'|'+at)%10000).padStart(4,'0').split('').map(Number);
const SKEY=n=>'gas-escape-v1:'+n;
function load(n){try{const v=localStorage.getItem(SKEY(n));return v?JSON.parse(v):null;}catch(e){return null;}}
const Q=[
 {zone:'A',type:'mc',text:'기체의 압력이 생기는 까닭으로 옳은 것은?',
  options:['기체 입자의 크기가 커지기 때문이다.','기체 입자가 끊임없이 운동하며 용기 벽에 충돌하기 때문이다.','기체 입자끼리 서로 강하게 끌어당기기 때문이다.','기체 입자가 용기 벽에 달라붙어 있기 때문이다.'],answer:1,
  exp:'기체 입자는 모든 방향으로 끊임없이 운동하면서 용기 벽에 충돌하여 힘을 가합니다. 이 힘 때문에 기체의 압력이 생깁니다.'},

/* ---------- 이동·충돌 ---------- */
const PR=.55,SPEED=7;
function collide(p){
  if(S.loc){const r=ROOMS[S.loc];p.x=Math.max(r.ox-RW+PR,Math.min(r.ox+RW-PR,p.x));p.z=Math.max(r.oz-RD+PR,Math.min(r.oz+RD-PR,p.z));}
  else{p.x=Math.max(-BX+PR,Math.min(BX-PR,p.x));p.z=Math.max(BZ0+PR,Math.min(BZ1-PR,p.z));}
  for(let it=0;it<2;it++)for(const o of obs){
    if(Math.abs(o.x-p.x)>12||Math.abs(o.z-p.z)>12)continue;
    if(o.t==='c'){const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz),m=o.r+PR;if(d<m&&d>1e-4){p.x=o.x+dx/d*m;p.z=o.z+dz/d*m;}}
    else{const cx=Math.max(o.x-o.hw,Math.min(o.x+o.hw,p.x)),cz=Math.max(o.z-o.hd,Math.min(o.z+o.hd,p.z));const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
      if(d<PR){if(d>1e-4){p.x=cx+dx/d*PR;p.z=cz+dz/d*PR;}else{const ox=o.hw+PR-Math.abs(p.x-o.x),oz=o.hd+PR-Math.abs(p.z-o.z);if(ox<oz)p.x+=Math.sign(p.x-o.x||1)*ox;else p.z+=Math.sign(p.z-o.z||1)*oz;}}}
  }
}
function step(dt){
  let dx=joyV.x,dz=joyV.y;
  if(keys.has('l'))dx-=1;if(keys.has('r'))dx+=1;if(keys.has('u'))dz-=1;if(keys.has('d'))dz+=1;
  const l=Math.hypot(dx,dz);
  if(l<.12){S.p.walk*=.85;return;}
  const k=Math.min(1,l);dx/=l;dz/=l;
  S.p.x+=dx*SPEED*k*dt;S.p.z+=dz*SPEED*k*dt;collide(S.p);
  const tr=Math.atan2(dx,dz);let d=tr-S.p.rot;d=Math.atan2(Math.sin(d),Math.cos(d));S.p.rot+=d*Math.min(1,dt*12);
  S.p.walk+=dt*10*k;
}

    for(const s of ST){if(s.zone!==S.loc)continue;const d=Math.hypot(p.x-s.x,p.z-s.z);if(d<bd){bd=d;best={kind:'st',s};}}
    if(!best&&Math.hypot(p.x-r.ox,p.z-(r.oz-3.8))<3)best={kind:'exp',k:S.loc};
    if(!best&&p.z>r.oz+RD-1.8&&Math.abs(p.x-r.ox)<2.4)best={kind:'exit'};

  for(const k of ZK){const d=DOORS[k];if(Math.hypot(p.x-d.x,p.z-d.z)<2.4)return{kind:'door',k};}
  if(Math.abs(p.x-GATE.x)<6&&p.z<GATE.z+5)return{kind:'gate'};

}

  const want=new THREE.Vector3(S.p.x,0,S.p.z).add(off);

    const pul=done||reduce?1:1+.12*Math.sin(t*3+i);s.ring.scale.set(pul,pul,1);});
  ZK.forEach((k,i)=>{const pul=reduce?1.2:1.2+.12*Math.sin(t*3+i);doorRings[k].scale.set(pul,pul,1);if(!S.exp[k]&&!reduce){const q=1.05+.12*Math.sin(t*4);expRings[k].scale.set(q,q,1);}});
  ice.rotation.y+=dt*.5;
  cabins.forEach(c=>{const u=((t*.025+c.o)%1);c.g.position.copy(cableA).lerp(cableB,u);});
  smoke.forEach(s=>{const u=((t*.25+s.o)%1);s.m.position.set(29.5+Math.sin(u*6+s.o*9)*.5,7.8+u*5,21.5+u*1.5);s.m.scale.setScalar(.6+u*1.4);s.m.material.opacity=.7*(1-u);});
  flames.forEach((f,i)=>{f.scale.y=1+.18*Math.sin(t*11+i*2);f.rotation.y=t*2;});fireLight.intensity=1.1+.25*Math.sin(t*13);
  balloon.position.y=14+Math.sin(t*.8)*.8;
  if(snow.visible){const pos=sg.attributes.position.array;
    for(let i=0;i<SNOW;i++){pos[i*3+1]-=dt*(2.2+(i%5)*.4);pos[i*3]+=Math.sin(t+i)*dt*.3;if(pos[i*3+1]<0)pos[i*3+1]+=30;}
    sg.attributes.position.needsUpdate=true;snow.position.set(Math.round(S.p.x/10)*10,0,Math.round(S.p.z/10)*10);}
  gateOpen+=((S.unlocked?1:0)-gateOpen)*Math.min(1,dt*2.5);
  leaves[0].position.x=-2.3-gateOpen*3.6;leaves[1].position.x=2.3+gateOpen*3.6;
  target=S.running&&!modal?findTarget():null;
  const key=target?[target.kind,target.k,target.s&&target.s.q,S.unlocked,target.s&&S.solved[target.s.q],target.s&&S.exp[target.s.zone],target.k&&S.exp[target.k]].join('|'):null;
  if(key!==lastT){lastT=key;
    if(!target)promptEl.hidden=true;
    else{promptEl.hidden=false;const kb=matchMedia('(any-pointer:coarse)').matches?'':'<kbd>E</kbd>';let txt;
      if(target.kind==='gate')txt=S.unlocked?'마지막 평가 시작':'정문 잠금 장치 조사';
      else if(target.kind==='door')txt=`${ZONES[target.k].name} 들어가기`;
      else if(target.kind==='exit')txt='밖으로 나가기';
      else if(target.kind==='exp')txt=`실험 ${target.k} ${S.exp[target.k]?'다시 보기':'시작하기'}`;
      else txt=`${target.s.label} 얼음 결정 ${!S.exp[target.s.zone]?'(잠김 · 실험 먼저)':S.solved[target.s.q]?'(해결 완료)':'조사'}`;

}

function newPart(b){const a=Math.random()*Math.PI*2,k=.75+Math.random()*.5;return{x:b.x0+PRAD+Math.random()*(b.x1-b.x0-PRAD*2),y:b.y0+PRAD+Math.random()*(b.y1-b.y0-PRAD*2),vx:Math.cos(a)*k,vy:Math.sin(a)*k};}
const mkParts=(n,b)=>Array.from({length:n},()=>newPart(b));
function moveParts(a,dt,b,sp,hit){for(const p of a){p.x+=p.vx*sp*dt;p.y+=p.vy*sp*dt;
  if(p.x<b.x0+PRAD){p.x=b.x0+PRAD;if(p.vx<0){p.vx=-p.vx;hit&&hit(3);}}
  if(p.x>b.x1-PRAD){p.x=b.x1-PRAD;if(p.vx>0){p.vx=-p.vx;hit&&hit(1);}}
  if(p.y<b.y0+PRAD){p.y=b.y0+PRAD;if(p.vy<0){p.vy=-p.vy;hit&&hit(0);}}
  if(p.y>b.y1-PRAD){p.y=b.y1-PRAD;if(p.vy>0){p.vy=-p.vy;hit&&hit(2);}}}}
function drawParts(g,a,col,num){a.forEach((p,i)=>{g.fillStyle=col;g.beginPath();g.arc(p.x,p.y,PRAD,0,7);g.fill();
  if(num){g.fillStyle='#1b2738';g.font='700 8px system-ui';g.textAlign='center';g.textBaseline='bottom';g.fillText(i+1,p.x,p.y-PRAD);}});}

function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- 확인 코드 (교사 검증용) ---------- */
const B32='0123456789ABCDEFGHIJKLMNOPQRSTUV',EPOCH=Date.UTC(2026,0,1),M44=(1n<<44n)-1n;
const b32enc=(v,n)=>{let s='';for(let i=0;i<n;i++){s=B32[Number(v%32n)]+s;v/=32n;}return s;};
const b32dec=s=>{let v=0n;for(const c of s){const i=B32.indexOf(c);if(i<0)return null;v=v*32n+BigInt(i);}return v;};
function makeCode(){
  const tmin=BigInt(Math.max(0,Math.min(1048575,Math.floor((S.finishAt.getTime()-EPOCH)/60000)))),el=BigInt(Math.min(16383,Math.floor(S.elapsed/1000))),
        wr=BigInt(Math.min(63,S.wrong.reduce((a,b)=>a+b,0))),at=BigInt(Math.min(15,S.attempt));
  const payload=((tmin*16384n+el)*64n+wr)*16n+at,mask=BigInt(cyrb53(SECRET+'#'+S.name))&M44;
  const body=b32enc(payload^mask,9),chk=b32enc(BigInt(cyrb53(S.name+'|'+body+'|'+SECRET)%1024),2),c=body+chk;
  return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
}
function submitUrl(){const c=makeCode().replace(/-/g,''),w=S.wrong.map(x=>Math.min(9,x)).join('');
  const sig=b32enc(BigInt(cyrb53(SECRET+'|sub|'+S.name+'|'+c+'|'+w)%1048576),4);
  return SHEET_URL+(SHEET_URL.includes('?')?'&':'?')+'n='+encodeURIComponent(S.name)+'&c='+c+'&w='+w+'&s='+sig;}
function readCode(name,code){
  const c=code.toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.length!==11)return null;
  const body=c.slice(0,9),chk=c.slice(9);if(b32enc(BigInt(cyrb53(name+'|'+body+'|'+SECRET)%1024),2)!==chk)return null;
  const enc=b32dec(body);if(enc===null)return null;let p=enc^(BigInt(cyrb53(SECRET+'#'+name))&M44);
  const at=Number(p%16n);p/=16n;const wr=Number(p%64n);p/=64n;const el=Number(p%16384n);p/=16384n;
  return{at,wr,el,date:new Date(EPOCH+Number(p)*60000)};
}
const fmtDT=d=>{const p2=n=>String(n).padStart(2,'0');return`${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;};

    <dl><dt>완료 일시</dt><dd>${fmtDT(d)}</dd><dt>소요 시간</dt><dd>${fmt(S.elapsed)}</dd>
        <dt>첫 시도 정답</dt><dd>${first} / 15</dd><dt>총 오답</dt><dd>${tw}회</dd>
        <dt>도전 회차</dt><dd>${S.attempt}회차</dd><dt>확인 코드</dt><dd class="code">${makeCode()}</dd></dl>
    <div class="qgrid">${S.wrong.map((w,i)=>`<div class="${w?'w':''}">${i+1}<b>${w?'×'+w:'○'}</b></div>`).join('')}</div>
    <div class="sign">${ds}<br><b>${esc(ISSUER)}</b><span class="seal">과학<br>사랑</span></div>
  </div>
  ${SHEET_URL?`<div class="result gold" style="margin-top:12px"><p class="exp"><b>결과 제출</b> 아래 버튼을 누르면 새 탭이 열리며 선생님의 기록표에 저장됩니다. 새 탭에 <b>"제출 완료"</b>가 보이면 성공입니다.</p>
    <div class="foot" style="margin-top:8px;justify-content:flex-start"><a class="btn amber" id="bSub" href="${esc(submitUrl())}" target="_blank" rel="noopener">결과 제출하기</a></div></div>`:''}
  <p class="note">${SHEET_URL?'제출이 안 되면 이 화면을 캡처하여 제출하세요.':'이 화면을 캡처하여 제출하세요.'} (○ 한 번에 정답, ×숫자 오답 횟수)</p>
  <div class="foot"><button class="btn ghost" type="button" id="bRv">문제 복습하기</button><button class="btn" type="button" id="bRe">새로 도전하기 (${S.attempt+1}회차)</button></div>`);
  $('bRv').addEventListener('click',openReview);$('bRe').addEventListener('click',()=>{const n=S.name,a=S.attempt+1;S=newState(n,a);save();begin();});
}
function openReview(){
  const list=Q.map((q,i)=>({q,i})).filter(o=>S.done||S.solved[o.i]),back=S.done;
  const items=list.length?list.map(({q,i})=>{const z=q.zone==='F'?{name:'마지막 평가',c:'#1b2738'}:ZONES[q.zone];
    return `<article><div class="meta"><span class="tag" style="background:${z.c}">${z.name}</span><span>문제 ${i+1}</span><span>오답 ${S.wrong[i]}회</span></div>
      <p class="q">${esc(q.text)}</p><p class="a">정답: <b>${esc(ansText(q))}</b></p><p class="exp">${esc(q.exp)}</p></article>`;}).join(''):'<p class="empty">아직 해결한 문제가 없습니다.</p>';
  openModal('review',`<div class="head"><span class="tag" style="background:#1b2738">${back?'전체 문제 복습':'오늘 푼 문제 다시 보기'}</span><button class="x" type="button" id="bX" aria-label="닫기">×</button></div>
    <div class="rv">${items}</div><div class="foot"><button class="btn" type="button" id="bBk">${back?'표창장으로 돌아가기':'닫기'}</button></div>`);
  const fn=back?showCert:closeModal;$('bBk').addEventListener('click',fn);$('bX').addEventListener('click',fn);
}

/* ---------- 시작 · 이어하기 ---------- */
function normName(v){const m=String(v).trim().match(/^(\d{4,5})\s*([가-힣]{2,5})$/);return m?`${m[1]} ${m[2]}`:null;}
function restore(n,sv){S=newState(n,sv.attempt||1);
  ['solved','wrong','reveal','exp','ed','unlocked','done','flock'].forEach(k=>{if(sv[k]!==undefined)S[k]=sv[k];});
  S.elapsed=sv.elapsed||0;S.finishAt=sv.finishAt?new Date(sv.finishAt):null;}
function begin(){S.p={x:START.x,z:START.z,rot:0,walk:0};S.loc=null;setEnv(false);camInit=false;S.running=true;S.t0=performance.now()-S.elapsed;lastSec=-1;hud();save();closeModal();}
function showStart(prefill){
  S=newState('');camInit=false;setEnv(false);hud();
  openModal('start',`<div class="eyebrow">중학교 과학 · 기체의 성질</div>
    <h2 style="font-size:2.1rem;margin-top:4px">설산 과학 리조트 탈출</h2>
    <p class="lede">폭설로 리조트 정문이 잠겼습니다. 네 건물에 들어가 실험을 하고, 얼어붙은 얼음 결정의 문제를 풀어 비밀번호 4자리를 모은 뒤 마지막 평가를 통과해 탈출하세요.</p>
    <div class="zones">${ZK.map(k=>`<div style="background:${ZONES[k].c}"><b>${ZONES[k].name}</b>${ZONES[k].sub} · 실험 1 + 문제 3</div>`).join('')}</div>
    <ul class="how">
      <li><span>이동</span>키보드 방향키(또는 WASD), 터치 기기는 왼쪽 아래 조이스틱</li>
      <li><span>입장</span>건물 출입문의 노란 원 위에서 E 키 또는 [입장] 버튼</li>
      <li><span>실험</span>건물 안쪽 실험대에서 실험 과제 3가지를 모두 마쳐야 얼음 결정이 녹습니다</li>
      <li><span>단서</span>한 건물의 3문제를 모두 맞히면 비밀번호 한 자리가 공개됩니다. 비밀번호는 학생마다 다릅니다</li>
      <li><span>주의</span>틀리면 눈보라에 휩쓸려 정문으로 돌아갑니다 (완료한 실험은 유지)</li>
      <li><span>탈출</span>정문 잠금 해제 후 마지막 평가 3문제를 모두 맞히면 표창장을 받습니다</li>
    </ul>
    <label class="lb" for="nmIn">학번과 이름</label>
    <input class="sa" id="nmIn" type="text" autocomplete="off" maxlength="14" placeholder="예) 20315 김과학" value="${esc(prefill||'')}">
    <div class="hint" id="nmMsg">학번 숫자와 한글 이름만 입력합니다. 같은 기기에서는 진행 기록이 자동 저장되어 새로고침해도 이어집니다.</div>
    <div class="foot" style="justify-content:space-between"><button class="btn ghost sm" type="button" id="bVer">교사용 코드 검증</button><button class="btn amber" type="button" id="bGo">탐험 시작</button></div>`);
  const inp=$('nmIn'),go=$('bGo'),msg=$('nmMsg'),upd=()=>go.disabled=!inp.value.trim();upd();
  inp.addEventListener('input',upd);inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim())start();});go.addEventListener('click',start);
  $('bVer').addEventListener('click',openVerify);
  function start(){
    const n=normName(inp.value);
    if(!n){msg.textContent='학번(4~5자리 숫자)과 이름(한글 2~5자)을 정확히 입력하세요. 예) 20315 김과학';msg.style.color='var(--bad)';return;}
    const sv=load(n);
    if(!sv){S=newState(n,1);begin();return;}
    restore(n,sv);
    if(!S.done){const solved=S.solved.filter(Boolean).length,ex=ZK.filter(k=>S.exp[k]).length;
      openModal('info',`<div class="head"><span class="tag" style="background:#1b2738">저장된 기록</span></div>
        <div class="result gold"><strong>${esc(n)} 학생의 기록을 불러왔습니다</strong><p class="exp">${S.attempt}회차 · 실험 ${ex}/4 · 해결 ${solved}/15 · 진행 시간 ${fmt(S.elapsed)}<br>정문에서 이어서 진행합니다.</p></div>
        <div class="foot"><button class="btn amber" type="button" id="bCont" autofocus>이어서 하기</button></div>`);
      $('bCont').addEventListener('click',begin);return;}
    openModal('info',`<div class="head"><span class="tag" style="background:#3fae68">탈출 완료 기록</span></div>
      <div class="result ok"><strong>이미 탈출에 성공했습니다</strong><p class="exp">${esc(n)} · ${S.attempt}회차 · 소요 시간 ${fmt(S.elapsed)}</p></div>
      <div class="foot"><button class="btn ghost" type="button" id="bNew">새로 도전하기 (${S.attempt+1}회차)</button><button class="btn amber" type="button" id="bSee" autofocus>표창장 다시 보기</button></div>`);
    $('bSee').addEventListener('click',()=>{hud();showCert();});
    $('bNew').addEventListener('click',()=>{const a=S.attempt+1;S=newState(n,a);begin();});
  }
}

resize();hud();$('loading').remove();showStart('');requestAnimationFrame(loop);
})();
</script>

</body></html>
